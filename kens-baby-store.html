<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ken's Baby Store</title>
<style type="text/css">
/* page style */
body {
 margin:0;
 min-width:810px;
 background-color:white;
 font-family:Arial, Helvetica, sans-serif;
 color:#77745f;
}

/* main website box */
#website {
width:794px;
 margin:8px auto;
background:white;
}

/* top part */
#top { height:74px; position:relative; }

/* store name */
.logo {float:left;width:425px;text-align:center;}
.logo h1 {
 margin:5px 0 0 0;
 color:#51246e;
 font-family:Georgia, "Times New Roman", serif;
 font-size:46px;
 line-height:51px;
}
.little-title {color:#91c9ac;font-size:13px;letter-spacing:1px;margin-left:150px;}

/* phone area */
.contact-box {
 float:right;
width:342px;height:58px;
 margin-top:10px;margin-right:14px;
}
.free-text {
float:left;width:107px;height:58px;
 padding:7px 9px 3px 8px;
 box-sizing:border-box;background-color:#dbeef5;
 color:#9c82b0;font-size:11px;
 border:1px solid #8298ac;border-right:0;
 border-radius:11px 0 0 11px;
}
.phone-picture {float:left;width:235px;height:58px;}
.phone-picture img {width:235px;height:58px;display:block;}

/* small color line */
.color-line {height:7px;margin:1px 14px 0 14px;}
.color-line span {height:7px;float:left;display:block;}
.c1 {width:45px;background:#f4a383}.c2 {width:11px;background:#91c9ca}.c3 {width:21px;background:#a58aaa}
.c4 {width:75px;background:#8fb9aa}.c5 {width:20px;background:#ec97aa}.c6 {width:54px;background:#e8b58c}
.c7 {width:34px;background:#d7dc88}.c8 {width:29px;background:#7da58b}.c9 {width:49px;background:#8493bd}
.c10 {width:105px;background:#e3bf9a}.c11 {width:169px;background:#8bc5be}.c12 {width:153px;background:#a78bb4}

/* menu links */
#menu {
 height:35px;
margin-left:14px;width:766px;
 position:relative;white-space:nowrap;
}
#menu a {float:left;color:#77745f;text-decoration:none;font-size:14px;margin:9px 22px 0 26px;}
#menu a:hover {color:#db7782;}
.flags {
 position:absolute;right:0;top:5px;
 width:98px;height:24px;
}
.flags img {width:98px;height:24px;display:block;}

/* main pictures */
#main {margin-left:14px;width:765px;}
.left-side {float:left;width:335px;margin-right:5px;}
.gift-photo {width:335px;height:220px;}
.gift-photo img {width:335px;height:220px;display:block;}

.small-photo {
 float:left;width:102px;height:156px;
margin-top:7px;
}
.small-photo img {width:102px;height:156px;display:block;}
/* sale box */
.sale {
float:left;width:233px;height:156px;
 padding:18px 7px 0 11px;margin-top:7px;
 box-sizing:border-box;
 background-color:#ef7884;color:white;
 font-size:18px;line-height:20px;position:relative;
}
.sale-number {font-size:60px;line-height:62px;font-weight:bold;letter-spacing:-4px;}
.percent {font-size:31px;font-weight:bold;position:relative;top:-18px;}
.off {position:absolute;right:8px;top:80px;font-size:28px;font-weight:bold;}

/* children picture */
.children-photo {float:left;width:425px;height:383px;}
.children-photo img {width:425px;height:383px;display:block;}

/* stop the float */
.clear {clear:both;}

/* bottom information */
#bottom {
width:766px;height:86px;
 margin:6px 0 0 14px;
}
#bottom img {width:766px;height:86px;display:block;}
</style>
</head>
<body>

<div id="website">
 <!-- top part -->
 <div id="top">
   <div class="logo">
    <h1>Ken's Baby Store</h1>
     <div class="little-title">The touch of love</div>
   </div>

  <div class="contact-box">
    <div class="free-text">ADD 1,000 Baht<br>TO GET FREE<br>SHIPPING*</div>
   <div class="phone-picture"><img src="images/phone-picture.png" alt="call for more detail"></div>
  </div>
 <div class="clear"></div>
</div>

<!-- small color line -->
<div class="color-line">
 <span class="c1"></span><span class="c2"></span><span class="c3"></span>
 <span class="c4"></span><span class="c5"></span><span class="c6"></span>
 <span class="c7"></span><span class="c8"></span><span class="c9"></span>
 <span class="c10"></span><span class="c11"></span><span class="c12"></span>
</div>

 <!-- menu -->
 <div id="menu">
  <a href="#">Home</a><a href="#">About us</a>
  <a href="#">Online store</a><a href="#">What's new</a>
  <a href="#">Store finder</a><a href="#">Contact us</a>
   <div class="flags"><img src="images/language-flags.png" alt="language flags"></div>
 </div>

<!-- main pictures and sale -->
<div id="main">
 <div class="left-side">
  <div class="gift-photo"><img src="images/gift-photo.jpg" alt="clothes and gift bags"></div>

   <div class="small-photo"><img src="images/small-photo.jpg" alt="baby clothes basket"></div>
  <div class="sale">
   <b>Selected items sale!</b><br>
    <span class="sale-number">20 - 70</span><span class="percent">%</span><br>
   <span class="off">off</span>
  </div>
 </div>

 <div class="children-photo"><img src="images/children-photo.jpg" alt="children photo"></div>
 <div class="clear"></div>
</div>

 <!-- bottom information -->
 <div id="bottom">
  <img src="images/bottom-information.png" alt="baby store information">
 </div>
</div>

</body>
</html>
