<html>
<head>
<style type="text/css">
* {
box-sizing: border-box;
}

body {
	margin:0;
    font-family: Arial, Helvetica, sans-serif;
}

#wrapper {
	max-width:800px;
	margin: 0 auto;
border: 1px solid #ccc;
}
#content{
padding:0 15px 6px;
}

#header-image img {
	width: 100%;
	display:block;
}

#hero {
display: flex;
	position: relative;
gap: 6px;
}

#hero-left{
	flex: 45 1 0%;
	display: flex;
    flex-direction: column;
	gap:6px;
}

#hero-right {
flex: 55 1 0%;
}

#hero-left img{
width: 100%;
	display: block;
}

#hero-right img {
	width:100%;
height: 100%;
	object-fit: cover;
	display: block;
}

#sale-row img {
	width: 100%;
display: block;
}

#bottom {
	display:flex;
	gap: 6px;
margin-top: 6px;
}

.bottom-box{
	flex: 1;
}
.bottom-box.wide {
flex: 2;
}

.bottom-box img {
	width: 100%;
	display:block;
}

.clear{ clear: both; }
</style>
</head>
<body>
<div id="wrapper">
	<div id="header-image">
	<img src="images/header.jpg" alt="Ken's Baby Store header">
	</div>

<div id="content">
		<div id="hero">
			<div id="hero-left">
			<img src="images/folded-clothes.png" alt="Baby clothes on shelf">
				<div id="sale-row">
				<img src="images/sale-box.png" alt="Selected items sale 20-70% off">
				</div>
			</div>
		<div id="hero-right">
			<img src="images/kids-tree.png" alt="Kids with christmas tree">
		</div>
		</div>
	<div class="clear"></div>

		<div id="bottom">
		<div class="bottom-box">
			<img src="images/safe-sleeping.png" alt="Baby Safe Sleeping">
		</div>
			<div class="bottom-box wide">
				<img src="images/update-shop.png" alt="Let's update and Shop Our Online Store">
			</div>
		</div>
	<div class="clear"></div>
</div>
</div>
</body>
</html>
